name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # This successful step is the barrier for all preceding prerequisites.
      - id: browsers
        run: npx playwright install --with-deps chromium
      - name: Standard E2E (Pricing disabled)
        run: npm run test:e2e
      - name: Pricing E2E (mock Gateway)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:pricing
      - name: Upload Playwright results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/standard/
            test-results/pricing/
          retention-days: 7
